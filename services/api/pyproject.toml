[project]
name = "trip-planner-api"
version = "0.1.0"
description = "Trip Planner API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "boto3>=1.35,<2",
    "timezonefinder>=6.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
