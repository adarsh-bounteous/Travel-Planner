<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Planner – App shell</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="prototype-utils.css">
  <style>
    .shell { display: flex; flex-direction: column; min-height: 100vh; }
    .shell-header { border-bottom: var(--border-width) solid var(--color-border); background: var(--color-bg); }
    .shell-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2); max-width: var(--size-content-max); margin: 0 auto; padding: var(--space-2) var(--space-3); }
    .shell-brand { font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-primary); text-decoration: none; }
    .shell-nav { flex-basis: 100%; }
    .shell-nav[hidden] { display: none !important; }
    .shell-nav.is-open { display: block !important; }
    .shell-nav ul { display: flex; flex-direction: column; gap: var(--space-1); margin: 0; padding: 0; list-style: none; }
    .shell-nav-utility { margin-top: var(--space-2); padding-top: var(--space-2); border-top: var(--border-width) solid var(--color-border); }
    .shell-link { display: flex; align-items: center; min-height: var(--size-control-md); padding: 0 var(--space-2); color: var(--color-fg); font-weight: var(--font-weight-medium); text-decoration: none; border-radius: var(--radius-md); }
    .shell-link:hover { background: var(--color-surface); color: var(--color-fg); }
    .shell-link[aria-current="page"] { color: var(--color-primary); background: var(--color-primary-subtle); }
    .shell-main { flex: 1; width: 100%; max-width: var(--size-content-max); margin: 0 auto; padding: var(--space-4) var(--space-3); min-width: 0; }
    .shell-footer { border-top: var(--border-width) solid var(--color-border); background: var(--color-surface); color: var(--color-fg-muted); font-size: var(--font-size-sm); }
    .shell-footer-inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-2); max-width: var(--size-content-max); margin: 0 auto; padding: var(--space-3); }
    /* 48rem = breakpoint-md token (media queries cannot read custom properties) */
    @media (min-width: 48rem) {
      .shell-toggle { display: none; }
      .shell-nav, .shell-nav[hidden] { display: flex !important; flex: 1; flex-basis: 0; align-items: center; justify-content: space-between; gap: var(--space-3); }
      .shell-nav ul { flex-direction: row; flex-wrap: wrap; }
      .shell-nav-utility { margin: 0; padding: 0; border: 0; }
      .shell-main { padding: var(--space-5) var(--space-4); }
    }
  </style>
</head>
<body>
  <div class="shell" data-arc-shell>
    <header class="shell-header">
      <div class="shell-bar">
        <a class="shell-brand" href="#">Travel Planner</a>
        <button class="btn btn-secondary shell-toggle" type="button" data-toggle="main-nav" aria-controls="main-nav" aria-label="Menu">Menu</button>
        <nav class="shell-nav" id="main-nav" aria-label="Main" hidden>
          <ul>
            <li><a class="shell-link" href="#" data-nav-key="trips">Trips</a></li>
            <li><a class="shell-link" href="#" data-nav-key="explore">Explore</a></li>
            <li><a class="shell-link" href="#" data-nav-key="bookings">Bookings</a></li>
            <li><a class="shell-link" href="#" data-nav-key="budget">Budget</a></li>
          </ul>
          <ul class="shell-nav-utility">
            <li><a class="shell-link" href="#" data-nav-key="saved">Saved</a></li>
            <li><a class="shell-link" href="#" data-nav-key="account">Account</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="shell-main">
      <div data-arc-content></div>
    </main>
    <footer class="shell-footer">
      <div class="shell-footer-inner">
        <span>Travel Planner</span>
        <span>Help · Privacy · Terms</span>
      </div>
    </footer>
  </div>
</body>
</html>
